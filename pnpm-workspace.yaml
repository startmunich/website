allowBuilds:
  # vgpu's headless Dawn adapter. We only use vgpu's browser entry point, so the
  # native build is never needed — keeping it off avoids downloading prebuilts.
  "@vgpu/adapter-node": false
  core-js: false
  protobufjs: true
  sharp: true
  unrs-resolver: true
  # Dependency of @vgpu/adapter-node, same reasoning.
  webgpu: false

overrides:
  "brace-expansion@^1.0.0": ^1.1.21
  fast-uri: ^3.1.9
  fflate: ^0.8.3
  js-yaml: ^4.3.2
  "minimatch@>=7.0.0": ^11.0.1
  postcss: ^8.5.32
  postcss-selector-parser: ^6.1.5
  sharp: ^0.35.5
  smol-toml: ^1.9.1
  systeminformation: ^5.33.16
  "@modelcontextprotocol/server": ^2.3.0
  undici: ^7.30.1
  uuid: ^11.1.1
