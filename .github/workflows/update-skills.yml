name: Update agent skills

# Keeps the project-scoped agent skills in .agents/skills/ current with their
# upstreams. Dependabot and Renovate cannot do this: neither tool understands
# skill folders, and skills are pinned by a content hash in skills-lock.json
# rather than by a semver range, so there is no version string for a bot to
# bump. `skills update -p` is the only supported updater.
#
# Deliberately opens a PR and stops there — it does not auto-merge. A skill
# update silently changes how agents behave in this repository, so that is a
# change worth a human reading the diff. (The PR that introduced this file was
# auto-merged, but only because it was adding skills for the first time; the
# weekly refreshes it produces should be read.)

on:
  schedule:
    # Thursday 04:23 UTC. Dependabot runs Monday 04:00 Europe/Berlin and
    # Renovate Sunday before 06:00, so a mid-week slot keeps a skill refresh
    # out of both windows and out of the Vercel preview / e2e stampede.
    - cron: "23 4 * * 4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    # Cloning the upstream skill repos plus 3 folders is quick. Ten minutes is
    # far past normal and stops a hung network clone from burning a runner.
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Check for a skills lock file
        id: present
        run: |
          if [ -f skills-lock.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No skills-lock.json — this repo has no project-scoped skills."
          fi

      # `skills update` exits 0 whether or not anything changed, so the change
      # itself is detected with git rather than trusted from the exit status.
      - name: Update project skills
        if: steps.present.outputs.found == 'true'
        run: npx --yes skills@1 update -p --yes

      - name: Open pull request
        if: steps.present.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Skills already up to date — no PR needed."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add .agents skills-lock.json
          git commit -m 'chore(skills): update agent skills'

          # --force-with-lease lets a re-run overwrite last week's branch, so a
          # still-open PR is updated in place instead of the run failing. The
          # lease makes it fail rather than clobber if anyone pushed by hand.
          branch="chore/update-agent-skills"
          git push --force-with-lease origin "HEAD:refs/heads/$branch" || {
            echo "::error::Could not push to $branch. If the branch was changed by hand, close its PR and re-run."
            exit 1
          }

          if gh pr view "$branch" --json number --jq .number >/dev/null 2>&1; then
            echo "PR for $branch is already open — updated it in place."
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title 'chore(skills): update agent skills' \
              --body 'Automated weekly refresh of the project-scoped agent skills in `.agents/skills/`, run by `skills update -p`.

            Review the diff before merging: a skill update changes how agents behave in this repository.'
          fi
